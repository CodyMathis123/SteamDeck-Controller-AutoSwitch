name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python syntax and unit tests
        run: |
          python3 -m compileall -q controller_fix.py tests
          python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n install.sh uninstall.sh scripts/install-remote.sh
      - name: Create and verify distributable ZIP
        run: |
          python3 scripts/package.py --output dist/steamdeck-controller-fix.zip
          unzip -t dist/steamdeck-controller-fix.zip
      - name: Upload release ZIP
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: steamdeck-controller-fix
          path: dist/steamdeck-controller-fix.zip
          if-no-files-found: error
